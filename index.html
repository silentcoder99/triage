<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triage</title>
<meta name="theme-color" content="#14342F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Triage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='108' fill='%2314342F'/%3E%3Crect x='104' y='120' width='304' height='104' rx='16' fill='%23F3EFE4'/%3E%3Crect x='104' y='288' width='304' height='104' rx='16' fill='%23E9A22B'/%3E%3C/svg%3E">
<style>
  :root{
    --felt:#14342F;
    --felt-lift:#1C4540;
    --felt-line:#2C5A53;
    --bone:#F3EFE4;
    --ink:#12211E;
    --marigold:#E9A22B;
    --bone-dim:rgba(243,239,228,.56);
    --bone-faint:rgba(243,239,228,.28);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --pad:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--felt);
    color:var(--bone);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.4;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

  /* ---------- shell ---------- */
  .app{
    min-height:100%;
    display:flex;flex-direction:column;
    padding:0 var(--pad);
    padding-bottom:calc(184px + env(safe-area-inset-bottom));
  }
  .top{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:calc(22px + env(safe-area-inset-top)) 0 20px;
  }
  .wordmark{
    font-family:var(--mono);
    font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--marigold);
  }
  .count{font-family:var(--mono);font-size:12px;color:var(--bone-faint);letter-spacing:.06em}

  /* ---------- list ---------- */
  .stack{border-top:1px solid var(--felt-line)}
  .row{
    display:flex;align-items:flex-start;gap:12px;
    padding:15px 0 15px 2px;
    border-bottom:1px solid var(--felt-line);
  }
  .rank{
    font-family:var(--mono);font-size:12px;color:var(--marigold);
    padding-top:5px;min-width:22px;font-variant-numeric:tabular-nums;
  }
  .row.past .rank{color:var(--bone-faint)}
  .body{flex:1;min-width:0;padding-top:1px}
  .text{word-wrap:break-word;overflow-wrap:anywhere}
  .mark{
    width:26px;height:26px;flex:none;margin-top:1px;
    border:1.5px solid var(--bone-faint);border-radius:50%;
    display:grid;place-items:center;transition:.16s;
  }
  .mark:active{transform:scale(.88)}
  .row.done .mark{background:var(--marigold);border-color:var(--marigold)}
  .row.done .mark::after{content:"";width:9px;height:5px;border:2px solid var(--felt);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
  .row.done .text{color:var(--bone-faint);text-decoration:line-through;text-decoration-thickness:1px}
  .kill{
    font-family:var(--mono);font-size:11px;color:var(--bone-faint);
    letter-spacing:.1em;padding:6px 0 0 6px;
  }
  .section{
    font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--bone-faint);margin:30px 0 8px;
  }
  .empty{
    font-family:var(--serif);font-size:19px;line-height:1.5;
    color:var(--bone-dim);padding:34px 0 10px;max-width:22ch;
  }
  .fade{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--bone-faint);padding:12px 0 0}

  /* ---------- dock ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;
    padding:24px var(--pad) calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--felt) 62%,rgba(20,52,47,0));
  }
  .sort{
    display:block;width:100%;
    background:var(--marigold);color:var(--ink);
    font-family:var(--mono);font-size:13px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    padding:17px;border-radius:2px;margin-bottom:12px;
    transition:transform .14s;
  }
  .sort:active{transform:scale(.985)}
  .add{display:flex;align-items:center;gap:10px;border:1px solid var(--felt-line);border-radius:2px;background:var(--felt-lift)}
  .add input{
    flex:1;min-width:0;background:none;border:none;outline:none;
    color:var(--bone);font-family:var(--serif);font-size:17px;padding:15px 0 15px 15px;
  }
  .add input::placeholder{color:var(--bone-faint);font-family:var(--sans);font-size:15px}
  .plus{font-size:26px;line-height:1;color:var(--marigold);padding:8px 16px 12px}

  /* ---------- duel ---------- */
  .duel{
    position:fixed;inset:0;z-index:20;background:var(--felt);
    display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) var(--pad) calc(24px + env(safe-area-inset-bottom));
  }
  .duel[hidden]{display:none}
  .meter{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:2px;background:var(--felt-line)}
  .bar span{display:block;height:100%;background:var(--marigold);width:0;transition:width .25s}
  .tally{font-family:var(--mono);font-size:11px;color:var(--bone-faint);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .quit{font-family:var(--mono);font-size:16px;color:var(--bone-dim);padding:4px 2px 4px 8px}
  .ask{
    font-family:var(--serif);font-style:italic;font-size:26px;
    text-align:center;padding:26px 0 20px;color:var(--bone);
  }
  .cards{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
  .card{
    background:var(--bone);color:var(--ink);border-radius:3px;
    font-family:var(--serif);font-size:21px;line-height:1.32;
    padding:26px 22px;text-align:left;
    min-height:112px;display:flex;align-items:center;
    box-shadow:0 10px 24px rgba(0,0,0,.28);
    transition:transform .16s,opacity .16s;
    animation:deal .26s ease both;
  }
  .card:nth-child(3){animation-delay:.05s}
  .card:active{transform:scale(.98)}
  .card.win{transform:scale(1.02);box-shadow:0 0 0 3px var(--marigold),0 10px 24px rgba(0,0,0,.28)}
  .card.lose{opacity:.25;transform:scale(.96)}
  .or{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--bone-faint);text-align:center;
  }
  .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--bone-faint);text-align:center;padding-top:22px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;z-index:30;left:var(--pad);right:var(--pad);
    bottom:calc(24px + env(safe-area-inset-bottom));
    background:var(--bone);color:var(--ink);border-radius:3px;
    padding:14px 16px;display:flex;align-items:center;gap:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    animation:rise .2s ease both;
  }
  .toast[hidden]{display:none}
  .toast p{margin:0;flex:1;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;line-height:1.5}
  .toast button{
    font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--marigold);padding-bottom:2px;
  }

  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes deal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:2px solid var(--marigold);outline-offset:3px}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="wordmark">Triage</div>
    <div class="count" id="count"></div>
  </div>
  <div id="list"></div>
</div>

<div class="dock">
  <button class="sort" id="sortBtn">Sort &#183; show top 5</button>
  <form class="add" id="addForm">
    <input id="addInput" placeholder="Add a task" autocomplete="off" enterkeyhint="done" maxlength="180">
    <button class="plus" type="submit" aria-label="Add task">+</button>
  </form>
</div>

<div class="duel" id="duel" hidden>
  <div class="meter">
    <div class="bar"><span id="barFill"></span></div>
    <div class="tally" id="tally" aria-live="polite"></div>
    <button class="quit" id="quitBtn" aria-label="Stop sorting">&#10005;</button>
  </div>
  <div class="ask">Which comes first?</div>
  <div class="cards">
    <button class="card" id="cardA"></button>
    <div class="or">or</div>
    <button class="card" id="cardB"></button>
  </div>
  <div class="hint">Every answer is remembered</div>
</div>

<div class="toast" id="toast" hidden><p id="toastText"></p><button id="toastAct"></button></div>

<script>
(function () {
  "use strict";

  var KEY = "triage-state-v1";
  var KEEP = 5;
  var CANCEL = { cancelled: true };

  var state = { tasks: [], verdicts: {} };
  var session = null;
  var pending = null;      // { resolve, reject, a, b }
  var toastTimer = null;
  var midnightTimer = null;

  var el = {
    list: document.getElementById("list"),
    count: document.getElementById("count"),
    sortBtn: document.getElementById("sortBtn"),
    form: document.getElementById("addForm"),
    input: document.getElementById("addInput"),
    duel: document.getElementById("duel"),
    cardA: document.getElementById("cardA"),
    cardB: document.getElementById("cardB"),
    bar: document.getElementById("barFill"),
    tally: document.getElementById("tally"),
    quit: document.getElementById("quitBtn"),
    toast: document.getElementById("toast"),
    toastText: document.getElementById("toastText"),
    toastAct: document.getElementById("toastAct")
  };

  /* ---------- storage (artifact bridge, else localStorage) ---------- */

  var hasBridge = typeof window.storage === "object" && window.storage && typeof window.storage.get === "function";

  function load() {
    if (hasBridge) {
      return window.storage.get(KEY, false).then(function (r) {
        return r && r.value ? JSON.parse(r.value) : null;
      }).catch(function () { return null; });
    }
    return Promise.resolve().then(function () {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }).catch(function () { return null; });
  }

  function save() {
    var payload = JSON.stringify(state);
    if (hasBridge) {
      window.storage.set(KEY, payload, false).catch(function () {});
      return;
    }
    try { localStorage.setItem(KEY, payload); } catch (e) {}
  }

  /* ---------- helpers ---------- */

  function uid() {
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function pairKey(x, y) { return x < y ? x + "|" + y : y + "|" + x; }

  function active() { return state.tasks.filter(function (t) { return !t.completedAt; }); }
  function finished() { return state.tasks.filter(function (t) { return t.completedAt; }); }
  // The list the user actually sees. Hidden tasks exist only inside a sort.
  function shown() { return state.tasks.filter(function (t) { return !t.completedAt && !t.hidden; }); }
  function listIsFull() { return shown().length >= KEEP; }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  // Worst-case comparisons for a merge sort that stops each merge once the
  // top KEEP of that merge are settled. Every merge costs min(size - 1, KEEP).
  function worstCase(n) {
    if (n < 2) return 0;
    var lo = Math.floor(n / 2);
    return worstCase(n - lo) + worstCase(lo) + Math.min(n - 1, KEEP);
  }

  function pruneVerdicts() {
    var live = {};
    state.tasks.forEach(function (t) { live[t.id] = 1; });
    Object.keys(state.verdicts).forEach(function (k) {
      var ids = k.split("|");
      if (!live[ids[0]] || !live[ids[1]]) delete state.verdicts[k];
    });
  }

  /* ---------- daily sweep ---------- */

  function sweep() {
    var today = dayKey(Date.now());
    var before = state.tasks.length;
    state.tasks = state.tasks.filter(function (t) {
      return !t.completedAt || dayKey(t.completedAt) === today;
    });
    if (state.tasks.length !== before) { pruneVerdicts(); save(); return true; }
    return false;
  }

  function armMidnight() {
    clearTimeout(midnightTimer);
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 3);
    midnightTimer = setTimeout(function () {
      sweep(); render(); armMidnight();
    }, Math.max(1000, next - now));
  }

  /* ---------- render ---------- */

  function render() {
    var open = shown(), done = finished();
    el.list.innerHTML = "";
    el.count.textContent = open.length ? open.length + " open" : "";

    if (!open.length && !done.length) {
      var e = document.createElement("p");
      e.className = "empty";
      e.textContent = "Nothing on the list. Add the first thing you're avoiding.";
      el.list.appendChild(e);
    }

    if (open.length) {
      var stack = document.createElement("div");
      stack.className = "stack";
      open.forEach(function (t, i) { stack.appendChild(rowFor(t, i + 1)); });
      el.list.appendChild(stack);
    }

    if (done.length) {
      var h = document.createElement("div");
      h.className = "section";
      h.textContent = "Done today";
      el.list.appendChild(h);
      var s2 = document.createElement("div");
      s2.className = "stack";
      done.forEach(function (t) { s2.appendChild(rowFor(t, null)); });
      el.list.appendChild(s2);
      var note = document.createElement("p");
      note.className = "fade";
      note.textContent = "Clears at midnight";
      el.list.appendChild(note);
    }

  }

  function rowFor(t, rank) {
    var row = document.createElement("div");
    row.className = "row" + (t.completedAt ? " done past" : "");

    var r = document.createElement("div");
    r.className = "rank";
    r.textContent = rank ? (rank < 10 ? "0" + rank : String(rank)) : "\u2014";
    row.appendChild(r);

    var body = document.createElement("div");
    body.className = "body";
    var txt = document.createElement("div");
    txt.className = "text";
    txt.textContent = t.text;
    body.appendChild(txt);
    var kill = document.createElement("button");
    kill.className = "kill";
    kill.type = "button";
    kill.textContent = "delete";
    kill.setAttribute("aria-label", "Delete " + t.text);
    kill.addEventListener("click", function () { remove(t.id); });
    body.appendChild(kill);
    row.appendChild(body);

    var mark = document.createElement("button");
    mark.className = "mark";
    mark.type = "button";
    mark.setAttribute("aria-label", (t.completedAt ? "Reopen " : "Complete ") + t.text);
    mark.addEventListener("click", function () { toggle(t.id); });
    row.appendChild(mark);

    return row;
  }

  /* ---------- actions ---------- */

  // The list holds five. Anything added past that waits out of sight for a sort.
  // Whether this happens is fully readable off the screen, so saying so leaks nothing.
  var BENCHED = "Saved. It comes back at the next sort.";

  function add(text) {
    text = text.trim();
    if (!text) return;
    var benched = listIsFull();
    state.tasks.push({
      id: uid(), text: text, createdAt: Date.now(), completedAt: null, hidden: benched
    });
    save(); render();
    if (benched) toast(BENCHED, null, null);
  }

  function toggle(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    if (t.completedAt) {
      var benched = listIsFull();
      t.completedAt = null;
      t.hidden = benched;
      state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
      var done = finished();
      state.tasks = state.tasks.filter(function (x) { return !x.completedAt; }).concat([t]).concat(done);
      save(); render();
      if (benched) toast(BENCHED, null, null);
      return;
    }
    t.completedAt = Date.now();
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; }).concat([t]);
    save(); render();
  }

  function remove(id) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    pruneVerdicts(); save(); render();
  }

  /* ---------- triage ---------- */

  el.sortBtn.addEventListener("click", function () { triage(); });

  function triage() {
    var open = active();
    if (open.length < 2 || session) {
      if (!session) toast("Nothing to sort.", null, null);
      return;
    }

    var snapshot = state.tasks.map(function (t) {
      return {
        id: t.id, text: t.text, createdAt: t.createdAt,
        completedAt: t.completedAt, hidden: !!t.hidden
      };
    });

    session = { asked: 0, recalled: 0, total: worstCase(open.length) };
    openDuel();

    mergeSort(open).then(function (sorted) {
      sorted.forEach(function (t, i) { t.hidden = i >= KEEP; });
      state.tasks = sorted.concat(finished());
      pruneVerdicts();
      var report = session;
      session = null;
      closeDuel();
      save(); render();
      announce(report, snapshot);
    }).catch(function (err) {
      session = null;
      closeDuel();
      save(); render();
      if (err !== CANCEL) throw err;
    });
  }

  function mergeSort(arr) {
    if (arr.length < 2) return Promise.resolve(arr);
    var mid = arr.length >> 1;
    return mergeSort(arr.slice(0, mid)).then(function (left) {
      return mergeSort(arr.slice(mid)).then(function (right) {
        return merge(left, right);
      });
    });
  }

  // Once KEEP elements of this merge are settled, nothing further can reach the
  // top KEEP overall, so the rest is concatenated unranked and never compared.
  function merge(left, right) {
    var out = [], i = 0, j = 0;
    function step() {
      if (out.length >= KEEP || i >= left.length || j >= right.length) {
        return Promise.resolve(out.concat(left.slice(i)).concat(right.slice(j)));
      }
      return compare(left[i], right[j]).then(function (leftFirst) {
        out.push(leftFirst ? left[i++] : right[j++]);
        return step();
      });
    }
    return step();
  }

  // Resolves true when `a` should come before `b`.
  function compare(a, b) {
    var k = pairKey(a.id, b.id);
    var known = state.verdicts[k];
    if (known) {
      session.recalled++;
      tick();
      return Promise.resolve(known === a.id);
    }
    return ask(a, b).then(function (winner) {
      state.verdicts[k] = winner;
      session.asked++;
      tick();
      save();
      return winner === a.id;
    });
  }

  function ask(a, b) {
    return new Promise(function (resolve, reject) {
      pending = { resolve: resolve, reject: reject, a: a, b: b };
      el.cardA.textContent = a.text;
      el.cardB.textContent = b.text;
      el.cardA.className = "card";
      el.cardB.className = "card";
      // restart the deal animation for the new pair
      el.cardA.style.animation = "none";
      el.cardB.style.animation = "none";
      void el.cardA.offsetWidth;
      el.cardA.style.animation = "";
      el.cardB.style.animation = "";
      el.cardA.focus({ preventScroll: true });
    });
  }

  function choose(side) {
    if (!pending) return;
    var p = pending;
    pending = null;
    var winner = side === "a" ? p.a : p.b;
    var winEl = side === "a" ? el.cardA : el.cardB;
    var loseEl = side === "a" ? el.cardB : el.cardA;
    winEl.className = "card win";
    loseEl.className = "card lose";
    var wait = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 170;
    setTimeout(function () { p.resolve(winner.id); }, wait);
  }

  function tick() {
    if (!session) return;
    var done = session.asked + session.recalled;
    var pct = session.total ? Math.min(100, Math.round((done / session.total) * 100)) : 100;
    el.bar.style.width = pct + "%";
    el.tally.textContent = done + " / " + session.total;
  }

  function openDuel() {
    el.duel.hidden = false;
    el.bar.style.width = "0%";
    el.tally.textContent = "0 / " + session.total;
    document.body.style.overflow = "hidden";
  }

  function closeDuel() {
    el.duel.hidden = true;
    pending = null;
    document.body.style.overflow = "";
  }

  function abort() {
    if (pending) { var p = pending; pending = null; p.reject(CANCEL); }
  }

  el.cardA.addEventListener("click", function () { choose("a"); });
  el.cardB.addEventListener("click", function () { choose("b"); });
  el.quit.addEventListener("click", abort);

  document.addEventListener("keydown", function (e) {
    if (el.duel.hidden) return;
    if (e.key === "Escape") { abort(); return; }
    if (e.key === "1" || e.key === "ArrowUp") { e.preventDefault(); choose("a"); }
    if (e.key === "2" || e.key === "ArrowDown") { e.preventDefault(); choose("b"); }
  });

  /* ---------- toast ---------- */

  function announce(report, snapshot) {
    var bits = [plural(report.asked, "tap")];
    if (report.recalled) bits.push(report.recalled + " recalled");
    toast(bits.join(" \u00b7 "), "Undo", function () {
      state.tasks = snapshot;
      pruneVerdicts(); save(); render();
      toast("List restored", null, null);
    });
  }

  function toast(msg, actionLabel, fn) {
    clearTimeout(toastTimer);
    el.toastText.textContent = msg;
    if (actionLabel) {
      el.toastAct.hidden = false;
      el.toastAct.textContent = actionLabel;
      el.toastAct.onclick = function () { el.toast.hidden = true; fn(); };
    } else {
      el.toastAct.hidden = true;
      el.toastAct.onclick = null;
    }
    el.toast.hidden = false;
    toastTimer = setTimeout(function () { el.toast.hidden = true; }, 9000);
  }

  /* ---------- wiring ---------- */

  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    add(el.input.value);
    el.input.value = "";
    el.input.focus();
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && sweep()) render();
  });

  load().then(function (saved) {
    if (saved && Array.isArray(saved.tasks)) {
      state.tasks = saved.tasks;
      state.verdicts = saved.verdicts || {};
    }
    sweep();
    render();
    armMidnight();
  });

  try {
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
  } catch (e) {}
})();
</script>
